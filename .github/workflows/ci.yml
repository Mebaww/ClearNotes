name: CI/CD

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, Lint & Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/clearnotes"
      MAIN_DB_URL: "postgresql://postgres:postgres@localhost:5432/clearnotes"
      BETTER_AUTH_SECRET: "ci-secret-at-least-32-characters-long-abcdef"
      BETTER_AUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      GOOGLE_CLIENT_ID: "mock-google-client-id"
      GOOGLE_CLIENT_SECRET: "mock-google-client-secret"
      GEMINI_API_KEY: "mock-gemini-api-key"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check TypeScript types
        run: npx tsc --noEmit

      - name: Lint codebase
        run: npm run lint

      - name: Build Next.js app
        run: npm run build

  deploy-staging:
    name: Deploy to Staging VPS
    runs-on: ubuntu-latest
    needs: validate
    # Deploys ONLY when code is pushed to staging, NEVER on main or pull requests
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'

    steps:
      - name: Deploy to VPS via SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::SSH_PRIVATE_KEY secret is completely EMPTY in GitHub Settings!"
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$SSH_KEY" | sed 's/^[ \t]*//' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" "cd ~/projects/ClearNotes && ./deploy.sh"
