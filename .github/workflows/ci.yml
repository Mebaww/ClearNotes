name: CI/CD

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, Lint & Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/clearnotes"
      MAIN_DB_URL: "postgresql://postgres:postgres@localhost:5432/clearnotes"
      BETTER_AUTH_SECRET: "ci-secret-at-least-32-characters-long-abcdef"
      BETTER_AUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      GOOGLE_CLIENT_ID: "mock-google-client-id"
      GOOGLE_CLIENT_SECRET: "mock-google-client-secret"
      GEMINI_API_KEY: "mock-gemini-api-key"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check TypeScript types
        run: npx tsc --noEmit

      - name: Lint codebase
        run: npm run lint

      - name: Build Next.js app
        run: npm run build

  deploy-staging:
    name: Deploy to Staging VPS
    runs-on: ubuntu-latest
    needs: validate
    # Deploys ONLY when code is pushed to staging, NEVER on main or pull requests
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ~/projects/ClearNotes
            ./deploy.sh
